<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HiBO · 文章与工具</title>
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
</head>
<body>

<header class="nav">
  <div class="wrap wrap-wide">
    <a class="brand" href="/">HiBO</a>
    <nav class="nav-links">
      <a class="on" href="/">首页</a>
      <a href="/files.html">文件库</a>
      <a href="/tools.html">工具</a>
      <a href="/about.html">关于</a>
      <button class="theme-btn" type="button" aria-label="切换明暗主题" title="切换明暗主题"></button>
    </nav>
  </div>
</header>

<main class="wrap wrap-wide">
  <div class="page-layout">
    <aside class="side" id="side"></aside>

    <div class="page-main">
      <section class="hero">
        <h1>记录 · 思考 · 沉淀</h1>
        <p>文章与资料按修改时间排列，最新的在最前面</p>
      </section>

      <div class="section-t">RECENT · 最近更新</div>
      <div id="recent-list">
        <p class="list-empty">正在加载...</p>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 HiBO</span>
    <span>Node · Markdown</span>
  </div>
</footer>

<script src="/panel.js"></script>
<script>
  const EXT_LABEL = { pdf: 'PDF', html: 'HTML', htm: 'HTML', md: 'MD', markdown: 'MD' };

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  /* 统一成 md / html / pdf 三种样式类 */
  function kindOf(ext) {
    if (ext === 'htm') return 'html';
    if (ext === 'markdown') return 'md';
    return ext || '';
  }

  function render(item) {
    const ext = item.kind === 'article' ? 'md' : item.ext;
    const row = el('a', 'entry entry-' + kindOf(ext));
    row.href = item.url;

    row.appendChild(el('span', 'entry-mark', EXT_LABEL[ext] || (ext || '').toUpperCase()));
    row.appendChild(el('span', 'entry-name', item.title));

    const source = item.kind === 'article' ? '文章' : (item.site || '文件');
    const meta = [item.mtime ? item.mtime.slice(0, 10) : '', source].filter(Boolean).join(' · ');
    row.appendChild(el('span', 'entry-meta', meta));

    return row;
  }

  async function loadRecent() {
    const list = document.getElementById('recent-list');
    try {
      const response = await fetch('/api/recent?limit=10', { cache: 'no-store' });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const data = await response.json();
      const items = data.items || [];

      list.textContent = '';
      if (!items.length) {
        list.appendChild(el('p', 'list-empty', '还没有文件。往 content/ 放 .md，或在 config.json 里登记目录。'));
        return;
      }

      for (const item of items) list.appendChild(render(item));
    } catch (err) {
      console.error('最近更新加载失败:', err);
      list.textContent = '';
      list.appendChild(el('p', 'list-empty', '加载失败，请确认服务已启动（node server.js）。'));
    }
  }

  document.addEventListener('DOMContentLoaded', loadRecent);
</script>
</body>
</html>
