<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工具 · HiBO</title>
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
</head>
<body>

<header class="nav">
  <div class="wrap wrap-wide">
    <a class="brand" href="/">HiBO</a>
    <nav class="nav-links">
      <a href="/">首页</a>
      <a href="/files.html">文件库</a>
      <a class="on" href="/tools.html">工具</a>
      <a href="/about.html">关于</a>
      <button class="theme-btn" type="button" aria-label="切换明暗主题" title="切换明暗主题"></button>
    </nav>
  </div>
</header>

<main class="wrap wrap-wide">
  <div class="page-layout">
    <aside class="side" id="side"></aside>

    <div class="page-main">
      <section class="hero">
        <h1>工具</h1>
        <p>入口写在 config.json 的 tools 里，加一项就多一个</p>
      </section>

      <div class="section-t">TOOLS</div>
      <div id="tool-list">
        <p class="list-empty">正在加载...</p>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 HiBO</span>
    <span>Node · 工具</span>
  </div>
</footer>

<script src="/panel.js"></script>
<script>
  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  /* 没写 desc 时：外链显示域名，站内显示路径 */
  function hintOf(tool) {
    if (tool.desc) return tool.desc;
    if (tool.external) {
      try {
        return new URL(tool.url).host;
      } catch {
        return tool.url;
      }
    }
    return tool.url;
  }

  /* 以 : 开头 → 当前访问的主机 + 该端口。:5000/ 在 127.0.0.1 下打开即 http://127.0.0.1:5000/ */
  function resolveUrl(url) {
    if (url.startsWith(':')) return location.protocol + '//' + location.hostname + url;
    return url;
  }

  function render(tool) {
    const row = el('a', 'entry');
    row.href = resolveUrl(tool.url);
    if (tool.external) {
      row.target = '_blank';
      row.rel = 'noopener';
    }

    row.appendChild(el('span', 'entry-mark', tool.external ? '↗' : '›'));
    row.appendChild(el('span', 'entry-name', tool.name));
    row.appendChild(el('span', 'entry-meta', hintOf(tool)));
    return row;
  }

  async function loadTools() {
    const list = document.getElementById('tool-list');
    try {
      const response = await fetch('/api/tools', { cache: 'no-store' });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const data = await response.json();

      list.textContent = '';
      if (data.error) {
        list.appendChild(el('p', 'list-error', data.error));
        return;
      }
      if (!data.items.length) {
        list.appendChild(el('p', 'list-empty', '还没有配置工具，在 config.json 的 tools 里加一项即可。'));
        return;
      }

      for (const tool of data.items) list.appendChild(render(tool));
    } catch (err) {
      console.error('工具加载失败:', err);
      list.textContent = '';
      list.appendChild(el('p', 'list-empty', '加载失败，请确认服务已启动（node server.js）。'));
    }
  }

  document.addEventListener('DOMContentLoaded', loadTools);
</script>
</body>
</html>
